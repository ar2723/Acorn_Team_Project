name: Bookmate CI/CD Practice

on:
  push:
    branches: [ "master" ] # main 브랜치에 푸시될 때 작동

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11 # 본인 프로젝트 자바 버전 확인
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: chmod mvnw
        run: chmod +x mvnw
        working-directory: ./Soso

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests # 테스트 제외하고 빌드
        working-directory: ./Soso

      - name: Find where the war is
        run: find . -name "*.war" # 현재 폴더 전체에서 .jar 파일을 검색해서 경로를 출력

      - name: Check build artifact
        run: ls -R Soso/target/*.war

      # 빌드된 Jar 파일을 미니 PC로 전송
      - name: Copy Jar to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "Soso/target/*.war"
          target: "~/app"
          strip_components: 2

      # 미니 PC에서 배포 스크립트 실행
      - name: Execute Remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script:
            # 기존 프로세스 종료
            fuser -k 9000/tcp || true
            rm -f ~/app/*.war.old || true
            [ -f ~/app/Soso-1.0.0.war ] && mv ~/app/Soso-1.0.0.war ~/app/Soso-1.0.0.war.old || true
            nohup java -jar ~/app/Soso-1.0.0.war --spring.profiles.active=real > ~/app/app.log 2>&1 &