name: Bookmate CI/CD Practice

on:
  push:
    branches: [ "master" ] # master 브랜치에 푸시될 때 작동

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11 # 프로젝트 자바 버전
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: chmod mvnw
        run: chmod +x mvnw
        working-directory: ./Soso

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests # 테스트 제외하고 빌드
        working-directory: ./Soso

      # 빌드된 War 파일을 미니 PC로 전송
      - name: Copy War to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "Soso/target/*.war"
          target: "~/app"
          strip_components: 2

      # 미니 PC에서 배포 스크립트 실행
      - name: Execute Remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 7일이 지난 백업 파일 자동 삭제
            find ~/app/oldback/ -name "*.back" -mtime +7 -delete
            
            # 1. 변수 생성
            NOW=$(date +%Y%m%d_%H%M%S)
            BACKUP_DIR="~/app/oldback"
            
            # 2. 백업 폴더가 없으면 생성 (에러 방지)
            mkdir -p $BACKUP_DIR
            
            # 3. 기존 서버 프로세스 종료
            fuser -k 9000/tcp || true
            
            # 4. 기존에 있던 war 파일을 시간값을 붙여서 백업
            # (예: soso.war -> soso_20260328_123005.war.back)
            if [ -f ~/app/soso.war ]; then
              mv ~/app/soso.war $BACKUP_DIR/soso_${NOW}.war.back
              echo "기존 버전을 $BACKUP_DIR 폴더로 백업했습니다."
            fi
            
            # 5. SCP로 전송된 새 파일을 표준 이름(soso.war)으로 변경
            mv ~/app/Soso-*.war ~/app/soso.war
            
            # 6. 새 버전 실행
            nohup java -jar ~/app/soso.war --spring.profiles.active=real > ~/app/app.log 2>&1 &
            echo "새 버전 배포 완료 ($NOW)"