# server port setting
server.port=9000

# 운영은 nginx(https) 뒤에서 http 로 받는다. 절대 주소로 리다이렉트하면 Location 이 http:// 로 나가므로
# 상대 경로(Location: /main)로 보내서 브라우저가 원래 scheme(https)을 유지하게 한다.
server.tomcat.use-relative-redirects=true

# context path setting
#server.servlet.context-path=/soso

# view page prefix, suffix setting
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# mapper location // classpath: == src/main/resources/
mybatis.mapper-locations=classpath:mapper/*.xml, classpath:mapper/support/*.xml
# type alias scan setting
mybatis.type-aliases-package=com.acorn.soso.**

# file size, request size setting
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# ---------------------------------------------------------------
# External API keys (environment variables, never commit real values)
# ---------------------------------------------------------------
naver.login.client-id=${NAVER_LOGIN_CLIENT_ID:not-configured}
naver.login.client-secret=${NAVER_LOGIN_CLIENT_SECRET:not-configured}
naver.login.redirect-uri=${NAVER_LOGIN_REDIRECT_URI:http://localhost:9000/naver/callback}
naver.search.client-id=${NAVER_SEARCH_CLIENT_ID:}
naver.search.client-secret=${NAVER_SEARCH_CLIENT_SECRET:}

# ---------------------------------------------------------------
# Flyway: schema is managed by src/main/resources/db/migration
# An existing DB without a history table is baselined at V1 (V1 is not executed on it).
# ---------------------------------------------------------------
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
