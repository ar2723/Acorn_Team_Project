# server port setting
server.port=9000

# context path setting
#server.servlet.context-path=/soso

# view page prefix, suffix setting
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# mapper location // classpath: == src/main/resources/
mybatis.mapper-locations=classpath:mapper/*.xml, classpath:mapper/support/*.xml
# type alias scan setting
mybatis.type-aliases-package=com.acorn.soso.**

# file size, request size setting
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB