# Local development profile: Oracle XE from docker-compose.yml
#   docker compose up -d
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
file.location=${FILE_LOCATION:${user.home}/bookmate/upload}

spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=${DB_USERNAME:bookmate}
spring.datasource.password=${DB_PASSWORD:bookmate}
